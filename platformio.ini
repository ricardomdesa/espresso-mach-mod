; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; O código de pareamento da máquina não pode ser versionado: este repositório é
; público e quem tem o código comanda a máquina (bomba, setpoint, extração).
; Ele mora em secrets.ini, que está no .gitignore. Copie secrets.ini.example
; para secrets.ini e ponha lá o código da sua máquina.
extra_configs = secrets.ini

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; O binário com Wi-Fi + servidor assíncrono passa de 1,1 MB e a tabela padrão
; (dois slots de OTA) deixa só 1,3 MB. Sem OTA por enquanto: 3 MB para o app.
board_build.partitions = huge_app.csv
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Habilita rotas com regex (ex.: /api/profiles/{id}) no ESPAsyncWebServer.
    -D ASYNCWEBSERVER_REGEX=1
    ; Os handlers REST montam JSON de alguns KB; 8 KB (padrão) é apertado.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; Chave fixa da API (endpoints que mudam estado). É o "código de pareamento"
    ; da máquina — como a senha na etiqueta embaixo do roteador. 12 hex,
    ; compilado no firmware e impresso no Serial no boot. O app pede esse código
    ; uma vez, no pareamento, e guarda no aparelho. O valor vem de secrets.ini,
    ; fora do controle de versão.
    '-D API_AUTH_KEY="${secrets.auth_key}"'
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.7.0
    adafruit/MAX6675 library@^1.1.2

; Teste isolado de Wi-Fi AP (bancada, fora do firmware MVP).
; src_filter é relativo a src/ (src_dir é opção global, não por-env).
[env:wifi-ap-test]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<../test/wifi_ap>

; Teste isolado de Wi-Fi STA (cliente). Edite o SSID/senha em
; test/wifi_sta/main.cpp antes de gravar.
[env:wifi-sta-test]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<../test/wifi_sta>
