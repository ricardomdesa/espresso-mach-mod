services:
  esp32-sim:
    build: .
    image: philco-esp32-sim
    ports:
      - "8080:8080"
      # Para paridade com a auto-descoberta do app (que tenta http://host sem
      # porta), troque por:  "80:8080"
    environment:
      SIM_PORT: "8080"
      SIM_AUTH_TOKEN: "sim-token"
      # SIM_AUTH_DISABLED: "1"   # aceita qualquer token
      SIM_INIT_TEMP: "25"
      SIM_INIT_AMBIENT: "25"
    restart: unless-stopped
